appId: com.msonntag.ordermate
name: iOS tablet import products
---
# Import base product list from iOS Files picker (iPad flow).
- assertVisible:
    id: 'product_input.go_to_settings'
- tapOn:
    id: 'product_input.go_to_settings'
- assertVisible:
    id: 'menu_selection.add_or_import'
- tapOn:
    id: 'menu_selection.add_or_import'
- assertVisible:
    id: 'menu_selection.import_option'
- tapOn:
    id: 'menu_selection.import_option'
- waitForAnimationToEnd:
    timeout: 15000
- retry:
    maxRetries: 10
    commands:
      - tapOn:
          point: '22%,48%'
      - tapOn:
          point: '51%,36%'
      - waitForAnimationToEnd
      - assertVisible:
          id: 'menu_selection.imported_product_count'
- tapOn:
    id: 'menu_selection.imported_save_button'
